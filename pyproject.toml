[tool.poetry]
name = "tin-whistle-openwind"
version = "0.1.0"
description = "High D tin whistle design simulation and optimization with OpenWind"
authors = ["Tin Whistle Research"]
readme = "README.md"
packages = [{ include = "tin_whistle_openwind", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
openwind = { path = "../openwind-1", develop = true }
numpy = "^2.2"
scipy = "^1.15"
matplotlib = "^3.10"
PyYAML = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pandas = "^2.2"
jupyter = "^1.1"
ipykernel = "^6.29"
nbformat = "^5.10"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
